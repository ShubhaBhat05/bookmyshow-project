{% extends "users/basic.html" %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="reset-success-card text-center">
                <div class="reset-success-icon">
                    <i class="fas fa-envelope"></i>
                </div>

                <h2>Reset Link Sent</h2>

                <p>
                    Please check your email for the link to reset your password.
                </p>

                <a href="{% url 'login' %}" class="btn btn-primary reset-login-btn">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
<style>
    .reset-success-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 40px 30px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    .reset-success-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #e8f1ff;
        color: #007bff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
    }

    .reset-success-card h2 {
        font-size: 27px;
        font-weight: 700;
        color: #2f3542;
        margin-bottom: 10px;
    }

    .reset-success-card p {
        color: #6c757d;
        font-size: 15px;
        margin-bottom: 24px;
    }

    .reset-login-btn {
        padding: 10px 22px;
        border-radius: 8px;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .reset-login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 12px rgba(0, 123, 255, 0.20);
    }
</style>
{% endblock %}
