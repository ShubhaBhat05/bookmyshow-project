{% extends "users/basic.html" %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="logout-card text-center">

                <div class="logout-icon">
                    <i class="fas fa-check"></i>
                </div>

                <h2>You have been logged out.</h2>

                <p>
                    Your session has ended successfully.
                </p>

                <a href="{% url 'login' %}" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    Log In Again
                </a>

            </div>

        </div>
    </div>
</div>
<style>
  .logout-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 40px 30px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
  }

  .logout-icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #d4edda;
    color: #28a745;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  .logout-card h2 {
    font-size: 27px;
    font-weight: 700;
    color: #2f3542;
    margin-bottom: 10px;
  }

  .logout-card p {
    color: #6c757d;
    font-size: 15px;
    margin-bottom: 24px;
  }

  .logout-card .btn {
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
{% endblock %}
