{% extends "users/basic.html" %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="reset-complete-card text-center">
                <div class="reset-complete-icon">
                    <i class="fas fa-check"></i>
                </div>

                <h2>Password Reset Complete</h2>

                <p>
                    Your password has been successfully reset.
                    You can now log in with your new password.
                </p>

                <a href="{% url 'login' %}" class="btn btn-primary reset-complete-btn">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    Log In
                </a>
            </div>
        </div>
    </div>
</div>
<style>
    .reset-complete-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 40px 30px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    .reset-complete-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #d4edda;
        color: #28a745;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }

    .reset-complete-card h2 {
        font-size: 27px;
        font-weight: 700;
        color: #2f3542;
        margin-bottom: 10px;
    }

    .reset-complete-card p {
        color: #6c757d;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 24px;
    }

    .reset-complete-btn {
        padding: 10px 22px;
        border-radius: 8px;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .reset-complete-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 12px rgba(0, 123, 255, 0.20);
    }
</style>
{% endblock %}
