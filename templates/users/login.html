{% extends "users/basic.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="modal-title mb-0" id="loginModalLabel">
                        <i class="fas fa-sign-in-alt me-2"></i> Log In
                    </h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        <!-- Username Input -->
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-user"></i>
                                </span>
                                {{ form.username }}
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                {{ form.password }}
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="fas fa-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary login-submit-btn">
                                  <i class="fas fa-sign-in-alt me-2"></i> Login
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center login-footer">
                    <a href="{% url 'password_reset' %}" class="text-decoration-none">Forgot Password?</a>
                    <hr>
                    <p class="mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
}
    .card-header {
    border-top-left-radius: 14px;
    border-top-right-radius: 14px;
    padding: 16px 20px;
}
    .input-group-text {
    background-color: #f8f9fa;
    border-color: #ced4da;
    color: #6c757d;
}
    .form-control:focus {
    box-shadow: 0 0 0 0.15rem rgba(0, 123, 255, 0.12);
    border-color: #80bdff;
}
.login-submit-btn {
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.login-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0, 123, 255, 0.20);
}
.login-footer {
    background: #ffffff;
    border-top: 1px solid #eeeeee;
    padding: 18px 20px;
}

.login-footer a {
    font-weight: 500;
}

.login-footer hr {
    margin: 14px 0;
    border-color: #eeeeee;
}
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('{{ form.password.id_for_label }}');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function() {
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            toggleIcon.classList.toggle('fa-eye');
            toggleIcon.classList.toggle('fa-eye-slash');
        });
    });
</script>

{% endblock %}
